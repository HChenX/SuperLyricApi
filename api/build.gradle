import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
        freeCompilerArgs.add("-jvm-default=enable")
    }
}

def defVersionName = '4.0'
def defVersionCode = 40

android {
    namespace 'com.hchen.superlyricapi'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        minSdk 26
        targetSdk 37

        consumerProguardFiles 'consumer-rules.pro'
        aarMetadata {
            minCompileSdk = 26
        }

        buildConfigField("int", "API_VERSION", "$defVersionCode")
        manifestPlaceholders = [
                superlyricapi_version_name: defVersionName,
                superlyricapi_version_code: defVersionCode
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    tasks.register("RemoveSuperLyricData") {
        doLast {
            def buildDir = "${project.buildDir}/generated/aidl_source_output_dir"
            def classFiles = fileTree(dir: buildDir, includes: ['**/SuperLyricData.java'])

            classFiles.each { file ->
                if (file.exists()) {
                    file.delete()
                    println("Remove File: ${file}")
                }
            }
        }
    }

    tasks.configureEach { task ->
        def name = task.name
        if ((name.contains("JavaWithJavac") || name.contains("Aidl")) && !name.contains("Test")) {
            task.finalizedBy(RemoveSuperLyricData)
        }
    }
}

tasks.register('androidSourcesJar', Jar) {
    from android.sourceSets.main.java.srcDirs
    from 'src/main/kotlin'
}

dependencies {
    compileOnly project(':hidden-api')
    implementation libs.annotation

    testImplementation libs.junit
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.HChenX'
                artifactId = 'SuperLyricApi'
                version = defVersionName

                artifact androidSourcesJar

                pom {
                    packaging = "aar"
                }
            }
        }
    }
}